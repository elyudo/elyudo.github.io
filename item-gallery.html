<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Item Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:white;
    color:black;
    font-family:'Space Mono', monospace;
    overflow-x:hidden;
}

/* GRAIN */
.grain{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:9999;
    opacity:0.12;
    mix-blend-mode:multiply;
    background-image:url("https://upload.wikimedia.org/wikipedia/commons/5/5c/Image_gaussian_noise_example.png");
}

/* NAV */
nav{
    border-bottom:6px solid black;
    padding:30px 5vw;
}

.back-link{
    text-decoration:none;
    color:black;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:1.2rem;
}

/* HEADER */
.header{
    padding:60px 5vw;
    border-bottom:6px solid black;
}

h1{
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(4rem,10vw,8rem);
    line-height:0.9;
    text-transform:uppercase;
    letter-spacing:-4px;
}

/* GALLERY GRID */
.gallery{
    padding:60px 5vw;
    display:flex;
    flex-wrap:wrap;
    gap:40px;
}

/* IMAGE CARDS */
.card{
    width:320px;
    border:6px solid black;
    background:white;
    overflow:hidden;
    transform:rotate(-1deg);
    transition:0.2s;
}

/* chaotic variation */
.card:nth-child(2){
    transform:rotate(2deg);
}

.card:nth-child(3){
    transform:rotate(-2.5deg);
}

.card:nth-child(4){
    transform:rotate(1.5deg);
}

/* hover glitch */
.card:hover{
    transform:rotate(0deg) scale(1.03);
    filter:contrast(150%) grayscale(100%);
}

/* image */
.card img{
    width:100%;
    display:block;
}

/* caption */
.caption{
    padding:15px;
    border-top:5px solid black;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:0.9rem;
}

.caption::before{
    content:"/// ";
}

</style>
</head>

<body>

<!-- GRAIN -->
<div class="grain"></div>

<!-- NAV -->
<nav>
    <a class="back-link" href="index.html">
        ← Back to Portfolio
    </a>
</nav>

<!-- TITLE -->
<section class="header">
    <h1>
        Choose Your<br>
        Fortune
    </h1>
</section>

<!-- GALLERY -->
<section class="gallery">

    <div class="card">
        <img src="image1.jpg" alt="Item view 1">
        <div class="caption">Top View</div>
    </div>

    <div class="card">
        <img src="image2.jpg" alt="Item view 2">
        <div class="caption">Back View</div>
    </div>

    <div class="card">
        <img src="image3.jpg" alt="Item view 3">
        <div class="caption">Front View</div>
    </div>

    <div class="card">
        <img src="image4.jpg" alt="Item view 4">
        <div class="caption">Other View</div>
    </div>

    <div class="card">
        <img src="image5.jpg" alt="Item view 4">
        <div class="caption">Shop View</div>
    </div>

</section>

</body>
</html>
