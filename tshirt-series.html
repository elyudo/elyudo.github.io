<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>T-Shirt Series</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:white;
    color:black;
    font-family:'Space Mono', monospace;
    overflow-x:hidden;
}

/* GRAIN OVERLAY */
.grain{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:9999;
    opacity:0.12;
    mix-blend-mode:multiply;
    background-image:url("https://upload.wikimedia.org/wikipedia/commons/5/5c/Image_gaussian_noise_example.png");
}

/* NAV */
nav{
    border-bottom:6px solid black;
    padding:30px 5vw;
}

.back-link{
    text-decoration:none;
    color:black;
    font-family:'Archivo Black', sans-serif;
    font-size:1.2rem;
    text-transform:uppercase;
}

/* HEADER */
.header{
    padding:60px 5vw;
    border-bottom:6px solid black;
}

h1{
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(4rem,10vw,8rem);
    line-height:0.9;
    text-transform:uppercase;
    letter-spacing:-4px;
}

/* CHAOTIC GALLERY */
.gallery{
    padding:60px 5vw;
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    justify-content:flex-start;
}

/* POSTERS */
.poster{
    width:320px;
    border:5px solid black;
    overflow:hidden;
    background:white;
    transition:0.2s ease;
    transform:rotate(-1deg);
}

/* slight chaos variation */
.poster:nth-child(2){
    transform:rotate(2deg);
}

.poster:nth-child(3){
    transform:rotate(-2.5deg);
}

/* hover glitch */
.poster:hover{
    transform:rotate(0deg) scale(1.03);
    filter:contrast(150%) grayscale(100%);
    animation:shake 0.2s infinite;
}

@keyframes shake{
    0%{transform:translate(1px,1px) rotate(0deg);}
    25%{transform:translate(-1px,2px) rotate(-1deg);}
    50%{transform:translate(-2px,-1px) rotate(1deg);}
    75%{transform:translate(2px,1px) rotate(0deg);}
    100%{transform:translate(1px,-1px) rotate(-1deg);}
}

/* IMAGES */
.poster img{
    width:100%;
    display:block;
}

/* CAPTION (zine label style) */
.caption{
    padding:15px;
    border-top:5px solid black;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:0.9rem;
    background:white;
}

.caption::before{
    content:"/// ";
    display:inline-block;
}

/* optional extra brutalist spacing */
.poster:hover .caption{
    background:black;
    color:white;
}

</style>
</head>

<body>

<!-- GRAIN -->
<div class="grain"></div>

<!-- NAV -->
<nav>
    <a class="back-link" href="index.html">
        ← Back to Portfolio
    </a>
</nav>

<!-- TITLE -->
<section class="header">

    <h1>
        T-Shirt<br>
        Series
    </h1>

</section>

<!-- SINGLE IMAGE -->
<section style="padding:60px 5vw;">

    <div style="
        border:6px solid black;
        transform:rotate(-1deg);
        background:white;
    ">

        <img 
            src="tshirts.jpg" 
            alt="T-Shirt Series Full Image"
            style="
                width:100%;
                display:block;
            "
        />

    </div>

</section>

</body>
</html>
